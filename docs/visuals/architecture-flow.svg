<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Animated architecture flow</title>
  <desc id="desc">Architecture diagram for the document manager showing Next.js, API routes, MySQL, encrypted storage, Tika, and Solr.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#176b64"/></marker>
    <style>
      .bg{fill:#fbfaf6}.box{fill:#fff;stroke:#c9ddd8;stroke-width:2}.box2{fill:#f1f8f6;stroke:#93c7bd;stroke-width:2}.title{font:700 24px Arial,Helvetica,sans-serif;fill:#123b3d}.text{font:600 17px Arial,Helvetica,sans-serif;fill:#123b3d}.small{font:400 13px Arial,Helvetica,sans-serif;fill:#466}.line{fill:none;stroke:#176b64;stroke-width:3;marker-end:url(#arrow);stroke-dasharray:10 12}.dot{fill:#e1a83b}.muted{fill:#dcebe7}
    </style>
  </defs>
  <rect class="bg" width="1200" height="620"/>
  <text x="60" y="62" class="title">System Architecture</text>
  <g transform="translate(60 115)">
    <rect class="box2" x="0" y="145" width="170" height="100" rx="8"/>
    <text class="text" x="37" y="184">User/Admin</text>
    <text class="small" x="30" y="212">Browser session</text>

    <rect class="box" x="250" y="35" width="190" height="100" rx="8"/>
    <text class="text" x="297" y="75">Next.js UI</text>
    <text class="small" x="284" y="104">Pages and dashboards</text>

    <rect class="box" x="250" y="260" width="190" height="100" rx="8"/>
    <text class="text" x="294" y="300">API Routes</text>
    <text class="small" x="278" y="329">Business logic layer</text>

    <rect class="box2" x="540" y="0" width="190" height="92" rx="8"/>
    <text class="text" x="596" y="39">MySQL</text>
    <text class="small" x="571" y="66">metadata and users</text>

    <rect class="box2" x="540" y="130" width="190" height="92" rx="8"/>
    <text class="text" x="574" y="169">Encrypted Files</text>
    <text class="small" x="579" y="196">local uploads storage</text>

    <rect class="box2" x="540" y="260" width="190" height="92" rx="8"/>
    <text class="text" x="592" y="299">Apache Tika</text>
    <text class="small" x="579" y="326">content extraction</text>

    <rect class="box2" x="540" y="390" width="190" height="92" rx="8"/>
    <text class="text" x="594" y="429">Apache Solr</text>
    <text class="small" x="578" y="456">full-text indexing</text>

    <path class="line" d="M170 195 C215 195 215 85 250 85"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/></path>
    <path class="line" d="M345 135 V260"><animate attributeName="stroke-dashoffset" values="0;-44" dur="1.8s" repeatCount="indefinite"/></path>
    <path class="line" d="M440 310 C480 310 490 46 540 46"><animate attributeName="stroke-dashoffset" values="0;-44" dur="2.2s" repeatCount="indefinite"/></path>
    <path class="line" d="M440 310 C485 310 490 176 540 176"><animate attributeName="stroke-dashoffset" values="0;-44" dur="2.2s" repeatCount="indefinite"/></path>
    <path class="line" d="M440 310 H540"><animate attributeName="stroke-dashoffset" values="0;-44" dur="2.2s" repeatCount="indefinite"/></path>
    <path class="line" d="M440 310 C485 310 490 436 540 436"><animate attributeName="stroke-dashoffset" values="0;-44" dur="2.2s" repeatCount="indefinite"/></path>

    <circle class="dot" r="7"><animateMotion dur="4.2s" repeatCount="indefinite" path="M170 195 C215 195 215 85 250 85"/></circle>
    <circle class="dot" r="6"><animateMotion dur="4.7s" repeatCount="indefinite" path="M440 310 C485 310 490 436 540 436"/></circle>
  </g>
</svg>
