<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Animated search pipeline</title>
  <desc id="desc">Search pipeline from query entry to API route, Solr search, result list, and decrypted document view.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#176b64"/></marker>
    <style>
      .bg{fill:#fbfaf6}.title{font:700 23px Arial,Helvetica,sans-serif;fill:#123d3e}.box{fill:#ffffff;stroke:#d2e2de;stroke-width:2}.text{font:700 16px Arial,Helvetica,sans-serif;fill:#123d3e}.small{font:400 12px Arial,Helvetica,sans-serif;fill:#5c706d}.line{fill:none;stroke:#176b64;stroke-width:3;marker-end:url(#arrow);stroke-dasharray:11 12}.dot{fill:#e1a83b}.bar{fill:#93c7bd}.bar2{fill:#e1a83b}.screen{fill:#f1f8f6;stroke:#93c7bd;stroke-width:2}
    </style>
  </defs>
  <rect class="bg" width="1200" height="430"/>
  <text class="title" x="60" y="58">Search and Retrieval Pipeline</text>
  <g transform="translate(72 115)">
    <path class="line" d="M170 86H270M440 86H540M710 86H810"><animate attributeName="stroke-dashoffset" values="0;-46" dur="1.5s" repeatCount="indefinite"/></path>
    <path class="line" d="M910 152 C910 225 610 225 610 152"><animate attributeName="stroke-dashoffset" values="0;-46" dur="1.8s" repeatCount="indefinite"/></path>

    <rect class="box" x="0" y="20" width="170" height="132" rx="8"/>
    <rect class="screen" x="28" y="50" width="112" height="34" rx="17"/>
    <circle cx="118" cy="67" r="10" fill="none" stroke="#176b64" stroke-width="5"/>
    <path d="M126 75l13 13" stroke="#176b64" stroke-width="5" stroke-linecap="round"/>
    <text class="text" x="48" y="113">Query</text>
    <text class="small" x="34" y="134">title, author, text</text>

    <rect class="box" x="270" y="20" width="170" height="132" rx="8"/>
    <text class="text" x="310" y="79">API Route</text>
    <text class="small" x="300" y="103">/documents/search</text>

    <rect class="box" x="540" y="20" width="170" height="132" rx="8"/>
    <text class="text" x="589" y="79">Solr</text>
    <text class="small" x="570" y="103">ranked full-text hits</text>
    <rect class="bar" x="575" y="120" width="26" height="12" rx="4"/><rect class="bar2" x="608" y="120" width="54" height="12" rx="4"/>

    <rect class="box" x="810" y="20" width="170" height="132" rx="8"/>
    <text class="text" x="852" y="72">Results</text>
    <text class="small" x="835" y="97">dashboard table</text>
    <rect class="bar" x="842" y="118" width="106" height="8" rx="4"/>
    <rect class="bar2" x="842" y="132" width="72" height="8" rx="4"/>

    <rect class="box" x="455" y="230" width="310" height="82" rx="8"/>
    <text class="text" x="525" y="263">View or Download</text>
    <text class="small" x="502" y="286">encrypted file is decrypted and streamed on demand</text>

    <circle class="dot" r="7"><animateMotion dur="4.1s" repeatCount="indefinite" path="M170 86H270H540H810"/></circle>
    <circle class="dot" r="6"><animateMotion dur="4.8s" begin="0.6s" repeatCount="indefinite" path="M910 152 C910 225 610 225 610 152"/></circle>
  </g>
</svg>
